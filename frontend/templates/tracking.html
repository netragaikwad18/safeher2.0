<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live GPS Tracking | Smart Women Safety Alert System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html">
        <i class="bi bi-shield-lock-fill text-danger fs-3"></i>
        <span class="safety-brand fs-4">WomenSafety AI</span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="/dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="p-4">
    <h2 class="fw-bold mb-3">Real-Time GPS Location Tracking</h2>
    <div id="tracking-map" class="map-box" style="height: 520px;"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    let map = L.map('tracking-map').setView([12.9716, 77.5946], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    L.marker([12.9716, 77.5946]).addTo(map).bindPopup('<b>Current Position</b>').openPopup();
  </script>
</body>
</html>
