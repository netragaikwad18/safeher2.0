<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Contacts | Smart Women Safety Alert System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html">
        <i class="bi bi-shield-lock-fill text-danger fs-3"></i>
        <span class="safety-brand fs-4">WomenSafety AI</span>
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="/dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="p-4">
    <h2 class="fw-bold mb-3">Trusted Emergency Contacts</h2>
    <div class="row g-4" id="contacts-grid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if (!checkAuth(true)) throw new Error('Not authenticated');
    async function loadContacts() {
      const grid = document.getElementById('contacts-grid');
      const contacts = await apiFetch('/api/contacts');
      grid.innerHTML = '';
      if (contacts) {
        contacts.forEach(c => {
          const col = document.createElement('div');
          col.className = 'col-md-4';
          col.innerHTML = `
            <div class="card card-safety p-4">
              <span class="badge ${c.is_primary ? 'bg-primary' : 'bg-secondary'}">${c.relationship}</span>
              <h5 class="fw-bold text-white mt-2">${c.name}</h5>
              <div class="text-info">${c.phone}</div>
            </div>
          `;
          grid.appendChild(col);
        });
      }
    }
    loadContacts();
  </script>
</body>
</html>
