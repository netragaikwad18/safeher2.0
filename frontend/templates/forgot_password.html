<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password / Emergency PIN | Smart Women Safety Alert System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 460px;">
    <div class="text-center mb-4">
      <a href="/index.html" class="text-decoration-none d-inline-flex align-items-center gap-2">
        <i class="bi bi-shield-lock-fill text-danger fs-1"></i>
        <h2 class="safety-brand m-0">WomenSafety AI</h2>
      </a>
      <p class="text-muted mt-2">Reset password using your secret Emergency PIN</p>
    </div>

    <div class="card card-safety p-4 shadow">
      <form id="reset-form">
        <div class="mb-3">
          <label class="form-label text-white">Registered Email</label>
          <input type="email" id="reset-email" class="form-control bg-dark border-secondary text-white" required placeholder="pooja@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label text-white">Secret Emergency PIN</label>
          <input type="password" id="reset-pin" class="form-control bg-dark border-secondary text-white" maxlength="6" required placeholder="Default is 4321 or 1234">
        </div>
        <div class="mb-3">
          <label class="form-label text-white">New Password</label>
          <input type="password" id="reset-new-pass" class="form-control bg-dark border-secondary text-white" minlength="6" required placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mt-2">Reset Password</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        email: document.getElementById('reset-email').value.trim(),
        emergency_pin: document.getElementById('reset-pin').value.trim(),
        new_password: document.getElementById('reset-new-pass').value
      };
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Reset failed');
        alert(data.message);
        window.location.href = '/login.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
