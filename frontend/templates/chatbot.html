<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Safety Assistant | Smart Women Safety Alert System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="p-4">
    <h2 class="fw-bold mb-3">AI Women Safety Assistant (English & Kannada)</h2>
    <div class="card card-safety p-4">
      <div id="chat-messages" class="mb-3">
        <div class="p-3 rounded bg-dark mb-2">Hello! Ask me about emergency helplines or SOS commands.</div>
      </div>
      <form id="chat-form" class="d-flex gap-2">
        <input type="text" id="chat-input" class="form-control bg-dark border-secondary text-white" placeholder="Ask about safety..." required>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const val = input.value;
      input.value = '';
      const box = document.getElementById('chat-messages');
      const res = await apiFetch('/api/chatbot/query', { method: 'POST', body: JSON.stringify({ message: val, language: 'en' }) });
      if (res) {
        const div = document.createElement('div');
        div.className = 'p-3 rounded bg-dark mb-2 text-info';
        div.textContent = res.reply;
        box.appendChild(div);
      }
    });
  </script>
</body>
</html>
