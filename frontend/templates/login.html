<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Women Safety Alert System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 460px;">
    <div class="text-center mb-4">
      <a href="/index.html" class="text-decoration-none d-inline-flex align-items-center gap-2">
        <i class="bi bi-shield-lock-fill text-danger fs-1"></i>
        <h2 class="safety-brand m-0">WomenSafety AI</h2>
      </a>
      <p class="text-muted mt-2">Sign in to your emergency safety network</p>
    </div>

    <div class="card card-safety p-4 shadow">
      <div id="login-alert" class="alert alert-danger d-none py-2" role="alert"></div>

      <form id="login-form">
        <div class="mb-3">
          <label class="form-label text-white">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control bg-dark border-secondary text-white" value="pooja@example.com" required placeholder="name@example.com">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label text-white">Password</label>
            <a href="/forgot_password.html" class="text-muted small text-decoration-none">Forgot PIN/Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
            <input type="password" id="password" class="form-control bg-dark border-secondary text-white" value="Password123!" required placeholder="Enter password">
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-bold mt-2" style="background: linear-gradient(135deg, #6c5ce7, #fd79a8); border:none;">
          <i class="bi bi-box-arrow-in-right me-2"></i> Secure Login
        </button>

        <div class="mt-3 p-2 rounded bg-dark border border-secondary border-opacity-25 text-muted small">
          <strong>Demo Credentials:</strong><br>
          • User: <code>pooja@example.com</code> / <code>Password123!</code><br>
          • Admin Cell: <code>admin@example.com</code> / <code>AdminPass123!</code>
        </div>
      </form>
    </div>

    <div class="text-center mt-3">
      <span class="text-muted">Don't have an account? </span>
      <a href="/register.html" class="text-decoration-none fw-semibold" style="color: #fd79a8;">Register here</a>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('login-btn');

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        localStorage.setItem('safety_token', data.access_token);
        localStorage.setItem('safety_user', JSON.stringify(data.user));

        if (data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/dashboard.html';
        }
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Secure Login';
      }
    });
  </script>
</body>
</html>
